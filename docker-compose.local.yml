# Local development profile: shared remote database + single gateway container.
# Copy .env.local.example to .env.local, set SQL_DSN and SESSION_SECRET, then run:
# docker compose --env-file .env.local -f docker-compose.local.yml up -d
services:
  new-api:
    image: calciumion/new-api:latest
    container_name: new-api-local
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./logs:/app/logs
    environment:
      TZ: Asia/Shanghai
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env.local}
      SQL_DSN: ${SQL_DSN:?Set the remote SQL_DSN in .env.local}
      LOG_SQL_DSN: ${LOG_SQL_DSN:-}
      SESSION_COOKIE_SECURE: "false"
      TRUSTED_PROXIES: none
      ERROR_LOG_ENABLED: "true"
      NODE_NAME: local-dev
    command: ["--log-dir", "/app/logs"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -q '\"success\":true'"]
      interval: 15s
      timeout: 5s
      retries: 5
